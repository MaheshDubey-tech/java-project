# =========================================================
# Database Configuration for Attendance Management System
# =========================================================

# Database Type: 'sqlite' (default, zero-setup embedded file) or 'mysql'
db.type=sqlite

# SQLite Configuration (file created automatically in project directory)
sqlite.url=jdbc:sqlite:attendance.db

# MySQL Configuration (To use MySQL, change db.type=mysql above and configure below)
mysql.url=jdbc:mysql://localhost:3306/attendance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
mysql.user=root
mysql.password=root
